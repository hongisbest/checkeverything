<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>법인차량 홍보스티커 셀프점검</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
  <section class="hero">
    <div>
      <p class="eyebrow">VEHICLE STICKER CHECK · V7</p>
      <h1>법인차량 홍보스티커 셀프점검</h1>
      <p class="sub">관리자가 지정한 기준사진과 검사영역을 확인하세요.</p>
    </div>
  </section>

  <section class="card">
    <span class="step">STEP 01</span>
    <h2>정상 기준사진</h2>
    <div id="referencePreview" class="reference-box">
      <div class="placeholder"><strong>기준사진을 불러오는 중</strong></div>
    </div>
    <p id="referenceTitle" class="help"></p>
  </section>

  <section class="card">
    <span class="step">STEP 02</span>
    <h2>차량사진 촬영</h2>
    <div class="camera-stage">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <img id="overlayImage" class="overlay-image">
      <div id="cameraPlaceholder" class="camera-placeholder">
        <strong>카메라를 시작해 주세요.</strong>
      </div>
    </div>
    <div class="controls">
      <button id="startCameraBtn" class="btn primary">카메라 시작</button>
      <button id="captureBtn" class="btn accent" disabled>촬영하기</button>
    </div>
    <div id="cameraMessage" class="message info">다음 단계에서 이 검사영역을 실제 비교에 사용합니다.</div>
  </section>

  <section class="card">
    <span class="step">CAPTURED</span>
    <h2>촬영결과</h2>
    <div id="capturePreview" class="reference-box">
      <div class="placeholder"><strong>촬영사진 없음</strong></div>
    </div>
  </section>

  <canvas id="captureCanvas" hidden></canvas>
</main>
<script src="/js/check.js"></script>
</body>
</html>
